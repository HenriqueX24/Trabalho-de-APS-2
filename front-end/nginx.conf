# Serve o frontend e repassa /svc/<servico>/ ao container do serviço na rede ticketflow-net.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve os nomes dos containers na hora (o frontend sobe mesmo com um serviço fora do ar).
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 2s;

    location ~ ^/svc/eventos(/.*)?$      { set $u http://eventos-service:8081;      proxy_pass $u$1$is_args$args; }
    location ~ ^/svc/ingressos(/.*)?$    { set $u http://ingressos-service:8082;    proxy_pass $u$1$is_args$args; }
    location ~ ^/svc/pagamento(/.*)?$    { set $u http://pagamento-service:8083;    proxy_pass $u$1$is_args$args; }
    location ~ ^/svc/notificacoes(/.*)?$ { set $u http://notificacoes-service:8084; proxy_pass $u$1$is_args$args; }

    location / {
        try_files $uri /index.html;
    }
}
